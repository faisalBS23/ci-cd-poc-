name: Playwright full suite

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saved-summary-main
  cancel-in-progress: false

jobs:
  full-suite:
    name: Run all Playwright specs
    runs-on: ubuntu-latest
    env:
      CI: "true"
      HEADLESS: "true"
      REFRESH_V5_AUTH: "true"
      TEQ_V5_FRONTEND_URL: ${{ secrets.TEQ_V5_FRONTEND_URL }}
      TEQ_V5_BACKEND_URL: ${{ secrets.TEQ_V5_BACKEND_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm packages
        env:
          HUSKY: "0"
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the full suite
        id: tests
        continue-on-error: true
        run: |
          set -euo pipefail
          : "${TEQ_V5_FRONTEND_URL:?Set the TEQ_V5_FRONTEND_URL repository secret}"
          : "${TEQ_V5_BACKEND_URL:?Set the TEQ_V5_BACKEND_URL repository secret}"
          : "${TEST_USER_EMAIL:?Set the TEST_USER_EMAIL repository secret}"
          : "${TEST_USER_PASSWORD:?Set the TEST_USER_PASSWORD repository secret}"
          npx playwright test \
            --config=tests-v5/configs/playwright.v5.config.ts \
            --project=v5-chromium

      - name: Update the saved report
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node --experimental-strip-types scripts/merge-saved-summary.ts update \
            reports/v5/json/results.json \
            reports/v5/saved-results.json \
            reports/v5/test-automation-summary.html

      - name: Commit the saved report
        run: |
          set -euo pipefail
          git add -f reports/v5/saved-results.json reports/v5/test-automation-summary.html
          if git diff --cached --quiet; then
            echo "Saved report already matches main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the test summary."
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-${{ github.run_id }}
          path: |
            reports/v5/
            test-results/v5/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail the check when a test failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
