name: Update saved summary

on:
  push:
    branches:
      - main

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: saved-summary-main
  cancel-in-progress: false

jobs:
  summary:
    name: Merge pull request results into the report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download this pull request's results
        id: download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/incoming"
          echo "changed=false" >> "$GITHUB_OUTPUT"

          # Bot report commits are not pull requests. Skip them.
          if [[ "${{ github.event.head_commit.message }}" == "Update the test summary." ]]; then
            echo "This push only updated the saved report. Nothing to absorb."
            exit 0
          fi

          PR_NUMBER="$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // empty' || true)"
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No pull request linked to this commit. Nothing to absorb."
            exit 0
          fi
          echo "Pull request: #$PR_NUMBER"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

          ARTIFACT_NAME="pr-run-results-${PR_NUMBER}"
          ARTIFACT_ID="$(gh api "repos/${{ github.repository }}/actions/artifacts?name=${ARTIFACT_NAME}&per_page=5" \
            --jq '[.artifacts[] | select(.expired == false)][0].id // empty')"
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "No artifact named ${ARTIFACT_NAME}. The pull request may not have run tests."
            exit 0
          fi
          echo "Artifact id: $ARTIFACT_ID"

          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/pr-results.zip"
          unzip -o "$RUNNER_TEMP/pr-results.zip" -d "$RUNNER_TEMP/incoming"
          if ! ls "$RUNNER_TEMP/incoming"/*.json >/dev/null 2>&1; then
            echo "Artifact zip had no JSON results."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          ls -1 "$RUNNER_TEMP/incoming"

      - name: Absorb incoming results
        if: steps.download.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node --experimental-strip-types scripts/merge-saved-summary.ts absorb \
            "$RUNNER_TEMP/incoming" \
            reports/v5/saved-results.json \
            reports/v5/test-automation-summary.html

      - name: Commit the saved report
        if: steps.download.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add -f reports/v5/saved-results.json reports/v5/test-automation-summary.html
          if git diff --cached --quiet; then
            echo "Saved report already matches main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the test summary."
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
