name: Update saved summary

on:
  push:
    branches:
      - main
    paths:
      - "reports/v5/incoming/**"
      - "reports/v5/saved-results.json"
      - ".github/workflows/update-summary-on-main.yml"

permissions:
  contents: write

concurrency:
  group: saved-summary-main
  cancel-in-progress: false

jobs:
  summary:
    name: Merge incoming results into the report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Absorb incoming results
        id: absorb
        run: |
          set -euo pipefail
          git pull --rebase origin main
          if [[ ! -d reports/v5/incoming ]] || ! ls reports/v5/incoming/*.json >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No incoming result files. Nothing to merge."
            exit 0
          fi
          echo "Incoming files:"
          ls -1 reports/v5/incoming/*.json
          node --experimental-strip-types scripts/merge-saved-summary.ts absorb \
            reports/v5/incoming \
            reports/v5/saved-results.json \
            reports/v5/test-automation-summary.html
          rm -f reports/v5/incoming/*.json
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the saved report
        if: steps.absorb.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git add -f reports/v5/saved-results.json reports/v5/test-automation-summary.html
          git add -A reports/v5/incoming || true
          if git diff --cached --quiet; then
            echo "Saved report already matches main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the test summary."
          git -c rebase.autoStash=true pull --rebase origin main
          git push origin HEAD:main
